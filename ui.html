<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Scout · 芝加哥二手车搜索</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#202c28;background:#f5f6f1;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1440px;margin:auto;padding:0 54px}.top{height:78px;border-bottom:1px solid #e0e5dd;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px;letter-spacing:-.04em}.mark{background:#164b3b;color:#fff;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;font-size:18px}.top-right{color:#74847b;font-size:12px}.live{display:inline-block;width:7px;height:7px;background:#49a774;border-radius:50%;margin-right:7px}.intro{padding:56px 0 40px}.eyebrow{color:#398265;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.intro h1{font-size:40px;letter-spacing:-.045em;margin:14px 0 11px;line-height:1.15}.intro p{color:#738178;font-size:14px;margin:0;line-height:1.7}.layout{display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:start}.panel{background:#fff;border:1px solid #e3e9e1;border-radius:14px;padding:23px;box-shadow:0 4px 20px #25463308}.panel h2{font-size:16px;margin:0 0 6px}.panel .sub{font-size:12px;line-height:1.6;color:#8a9890;margin:0 0 24px}label{display:block;font-size:12px;font-weight:700;color:#43564b;margin:17px 0 7px}input{width:100%;border:1px solid #dce4dc;border-radius:8px;padding:11px 12px;outline:none;color:#263d30;background:#fbfcfa}input:focus{border-color:#4b9172;box-shadow:0 0 0 3px #4b917220}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.search{margin-top:22px;width:100%;border:0;border-radius:8px;background:#174f3e;color:#fff;font-weight:700;padding:13px}.search:hover{background:#236c51}.search:disabled{opacity:.65;cursor:wait}.hint{border-top:1px solid #edf0ec;margin-top:22px;padding-top:18px;color:#89978e;font-size:11px;line-height:1.7}.heading{display:flex;justify-content:space-between;align-items:end;margin:1px 0 19px}.heading h2{font-size:21px;margin:0;letter-spacing:-.025em}.heading p{color:#89968e;font-size:12px;margin:7px 0 0}.tag{background:#e7f1e9;color:#43815c;padding:7px 10px;border-radius:20px;font-size:11px;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.metric{border:1px solid #e4eae3;background:#fff;border-radius:11px;padding:16px 18px}.metric span{font-size:11px;color:#8b9990}.metric strong{display:block;margin-top:8px;font-size:22px;letter-spacing:-.03em}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e3e9e1;border-radius:13px;padding:20px;min-width:0}.card-top{display:flex;justify-content:space-between;gap:10px;align-items:start}.car-title{font-size:16px;font-weight:750;line-height:1.4}.trim{color:#8b9990;font-size:12px;margin-top:5px}.price{font-weight:800;font-size:20px;white-space:nowrap;color:#1e503e}.details{display:flex;gap:18px;flex-wrap:wrap;border-top:1px solid #eef1ed;border-bottom:1px solid #eef1ed;margin:18px 0 14px;padding:13px 0;color:#677a6e;font-size:12px}.status{font-size:12px;color:#78897e;line-height:1.5}.drop{color:#36825d;font-weight:700;margin-top:8px}.card-foot{display:flex;justify-content:space-between;gap:8px;margin-top:18px;align-items:center}.dealer{font-size:11px;color:#8c9a91;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:12px;white-space:nowrap}.actions a,.actions button{font-size:12px;color:#23694e;font-weight:700;text-decoration:none;border:0;background:none;padding:0}.empty{border:1px dashed #d9e3d9;border-radius:13px;padding:65px 20px;text-align:center;color:#839187;background:#fff}.empty-icon{width:50px;height:50px;border-radius:16px;background:#eff5ef;display:grid;place-items:center;margin:0 auto 18px;font-size:22px}.empty strong{color:#425b4a;display:block;margin-bottom:8px}.notice{font-size:12px;line-height:1.6;color:#a16e2c;background:#fff7e8;padding:11px 14px;border-radius:8px;margin-bottom:14px}.hidden{display:none}.error{color:#a43e39;background:#fff1ef}.history{margin-top:14px;border-top:1px solid #eef1ed;padding-top:12px;color:#6d7e73;font-size:12px;line-height:1.8}.footer{padding:50px 0 30px;color:#a0aca3;font-size:11px}@media(max-width:900px){.shell{padding:0 24px}.layout{grid-template-columns:1fr}.panel{max-width:none}.intro{padding:38px 0 30px}.intro h1{font-size:32px}}@media(max-width:600px){.cards{grid-template-columns:1fr}.metrics{gap:7px}.metric{padding:12px}.metric strong{font-size:18px}.top-right{display:none}.shell{padding:0 16px}}
</style>
</head>
<body><div class="shell"><header class="top"><div class="brand"><span class="mark">⌁</span> CAR SCOUT</div><div class="top-right"><span class="live"></span>本地运行 · CLCAuto 公开数据</div></header>
<section class="intro"><div class="eyebrow">CHICAGO USED CAR FINDER</div><h1>找到适合你的下一辆车。</h1><p>搜索芝加哥 dealer 的在售车辆，追踪价格变化，了解同类车的标价。</p></section>
<main class="layout"><aside class="panel"><h2>搜索条件</h2><p class="sub">设置预算和偏好，开始寻找合适的车。</p><form id="form"><label for="location">城市 / 地区</label><input id="location" name="location" value="Chicago" required maxlength="80"><div class="twocol"><div><label for="make">品牌</label><input id="make" name="make" placeholder="例如 Toyota" maxlength="80"></div><div><label for="model">车型</label><input id="model" name="model" placeholder="例如 Corolla" maxlength="80"></div></div><label for="max_price">最高价格 · 美元</label><input id="max_price" name="max_price" type="number" min="1" max="10000000" value="18000" required><label for="max_miles">最高里程 · 英里</label><input id="max_miles" name="max_miles" type="number" min="1" max="10000000" value="90000" required><label for="pages">最多搜索页数</label><input id="pages" name="pages" type="number" min="1" max="10" value="5" required><button class="search" id="submit" type="submit">搜索车辆　↗</button></form><div class="hint">数据来源：CLCAuto 公开接口。按城市名称搜索，覆盖范围取决于平台车源。</div></aside>
<section><div class="heading"><div><h2>搜索结果</h2><p id="subtitle">选择条件，开始你的搜索</p></div><span class="tag">DEALER 车源</span></div><div class="metrics"><div class="metric"><span>符合条件</span><strong id="count">—</strong></div><div class="metric"><span>市场样本</span><strong id="sample">—</strong></div><div class="metric"><span>本次降价</span><strong id="drops">—</strong></div></div><div id="notice" class="notice hidden" role="status"></div><div id="results" class="cards"><div class="empty" style="grid-column:1/-1"><div class="empty-icon">⌕</div><strong>准备好探索了吗？</strong>点击搜索，查看符合条件的车辆。</div></div></section></main><footer class="footer">CAR SCOUT　 /　 本地价格记录 · 标价仅供参考，购买前请确认车况与落地价。</footer></div>
<script>
const $=id=>document.getElementById(id), money=n=>'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0});
const text=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value??'';if(cls)e.className=cls;return e};
function renderCar(c){const card=text('article','','card'),top=text('div','','card-top'),left=text('div');left.append(text('div',[c.year,c.make,c.model].filter(Boolean).join(' '),'car-title'),text('div',c.trim||'配置未提供','trim'));top.append(left,text('div',money(c.price),'price'));card.append(top);const details=text('div','','details');details.append(text('span',Number(c.miles).toLocaleString()+' mi'),text('span',c.city||'位置未提供'));card.append(details);let status='可比车不足，暂无法估价';if(c.market_median!==''){const diff=Number(c.market_difference);status=`参考中位数 ${money(c.market_median)} · ${c.comparable_count} 辆可比车 · ${diff<0?'低于':diff>0?'高于':'等于'}中位数 ${money(Math.abs(diff))}`;if(c.market_status==='sample_incomplete')status+='（样本不完整）'}card.append(text('div',status,'status'));if(c.price_drop!=='')card.append(text('div',`↓ 较上次降价 ${money(c.price_drop)} (${c.price_drop_percent}%)`,'drop'));const foot=text('div','','card-foot'),actions=text('div','','actions'),history=text('button','价格历史');history.type='button';const hist=text('div','','history hidden');history.addEventListener('click',async()=>{if(!hist.classList.contains('hidden')){hist.classList.add('hidden');return}hist.textContent='正在读取…';hist.classList.remove('hidden');try{const r=await fetch('/api/history?id='+encodeURIComponent(c.listing_id));const d=await r.json();if(!r.ok)throw Error(d.error);hist.replaceChildren(...(d.history.length?d.history.map(x=>text('div',new Date(x.date).toLocaleString()+'　'+money(x.price))):[text('div','暂无记录')]));}catch(e){hist.textContent='无法读取价格历史。'}});actions.append(history);try{const u=new URL(c.url);if(u.protocol==='https:'&&u.hostname==='www.clcauto.com'){const a=text('a','查看车源 ↗');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';actions.append(a)}}catch{}foot.append(text('div',c.dealer||'Dealer','dealer'),actions);card.append(foot,hist);return card}
$('form').addEventListener('submit',async e=>{e.preventDefault();const button=$('submit'),notice=$('notice');button.disabled=true;button.textContent='正在搜索…';notice.className='notice hidden';$('subtitle').textContent='正在查询，请稍候';try{const form=new FormData(e.currentTarget);const data=Object.fromEntries(form);const r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await r.json();if(!r.ok)throw Error(result.error||'搜索失败');$('count').textContent=result.cars.length;$('sample').textContent=result.market_count;$('drops').textContent=result.cars.filter(c=>c.price_drop!=='').length;$('subtitle').textContent='按价格从低到高排序 · '+data.location;if(result.incomplete){notice.textContent='市场样本尚未全部获取，参考价可能存在偏差。可以增加搜索页数。';notice.className='notice'}const container=$('results');container.replaceChildren();if(result.cars.length)result.cars.forEach(c=>container.append(renderCar(c)));else{const empty=text('div','','empty');empty.style.gridColumn='1/-1';empty.append(text('strong','没有找到符合条件的车辆'),text('div','尝试调整预算、里程或车型。'));container.append(empty)}}catch(err){notice.textContent=err.message||'搜索失败，请检查网络。';notice.className='notice error';$('subtitle').textContent='搜索未完成'}finally{button.disabled=false;button.textContent='搜索车辆　↗'}});
</script></body></html>
